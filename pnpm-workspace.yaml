# pnpm's settings file. This repository is a single package, so there is no
# `packages:` glob — but pnpm 10+ reads settings such as `allowBuilds` only from
# here, and ignoring them leaves esbuild's postinstall unrun on a fresh clone
# (vitest needs the platform binary it fetches).

# esbuild's postinstall only downloads its platform binary; vitest needs it.
allowBuilds:
  esbuild: true

# `pnpm run` otherwise re-runs a full dependency-status verification before every
# script, which fails whenever a build-tool transitive was published inside this
# machine's minimumReleaseAge window. Installs are still verified; only the
# per-script re-check is skipped.
verifyDepsBeforeRun: false

# The optional `@deepseek-ai/dsh` peer (declared purely so DSH's compatibility gate
# has something to read) is otherwise resolvable from the registry, so pnpm's
# default `autoInstallPeers: true` pulls the whole harness — and its own dozen
# `@deepseek-ai/dsh-*` dependencies — into this package's own node_modules for
# nothing this repo's build or tests use. Every profile `dsh` itself generates
# already sets this to `false` (`packages/boot/app-boot/src/profile.ts` in the
# harness repo); mirroring it here keeps a plain `pnpm install` in this checkout
# from doing the same.
autoInstallPeers: false
