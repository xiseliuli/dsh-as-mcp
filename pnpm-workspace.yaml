packages:
  - 'packages/*'

# esbuild's postinstall only fetches its platform binary; vitest needs it.
allowBuilds:
  esbuild: true

# `pnpm run` otherwise re-runs a full dependency-status verification before
# every script, which fails whenever a build-tool transitive was published
# inside this machine's minimumReleaseAge window. Installs are still verified;
# only the per-script re-check is skipped.
verifyDepsBeforeRun: false
